name: se7ety
description: "A new Flutter project."


publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  flutter_bloc: ^9.1.0
  smooth_page_indicator: ^1.2.1
  gap: ^3.0.1
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1
  google_nav_bar: ^5.0.7
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  googleapis_auth: ^2.0.0
  flutter_local_notifications: ^19.1.0
  # services map
  open_street_map_search_and_pick: ^0.1.1
  geolocator: ^10.1.1
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  # firebase services
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5
  flutter_rating_bar: ^4.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true


  assets:
    - assets/image/
    - assets/json/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400

        - asset: assets/font/Cairo-Medium.ttf
          weight: 500

        - asset: assets/font/Cairo-SemiBold.ttf
          weight: 600

        - asset: assets/font/Cairo-Light.ttf
          weight: 300

        - asset: assets/font/Cairo-Bold.ttf
          weight: 700



        
    

